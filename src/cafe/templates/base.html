<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}가죽공예 카페 에이전트{% endblock %}</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6b7280;
      --border:#e5e7eb; --accent:#8a5a2b; --accent-weak:#f5ede2;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0f1216; --card:#171b21; --text:#e6e8eb; --muted:#9aa4b2;
        --border:#252b33; --accent:#c79a68; --accent-weak:#241d15; }
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif;
      line-height:1.55; }
    header{ position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--border);
      padding:12px 20px; display:flex; align-items:center; gap:20px; z-index:10; }
    header .brand{ font-weight:700; }
    header nav{ display:flex; gap:14px; }
    header nav a{ color:var(--muted); text-decoration:none; font-size:14px; }
    header nav a:hover{ color:var(--text); }
    main{ max-width:920px; margin:0 auto; padding:24px 20px 80px; }
    h1{ font-size:20px; margin:0 0 4px; }
    h2{ font-size:16px; margin:24px 0 10px; }
    .sub{ color:var(--muted); font-size:13px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:16px; margin:12px 0; }
    .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .spacer{ flex:1; }
    .badge{ font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--border);
      color:var(--muted); white-space:nowrap; }
    .badge.green{ background:#e7f7ee; color:#137a41; border-color:#bce7cf; }
    .badge.blue{ background:#e8f0fe; color:#1a56c4; border-color:#c3d7fb; }
    .badge.amber{ background:#fdf2e0; color:#a15c00; border-color:#f3ddb0; }
    .badge.red{ background:#fdecec; color:#b42323; border-color:#f5c9c9; }
    @media (prefers-color-scheme: dark){
      .badge.green{ background:#10281c; color:#5fd39a; border-color:#1c4230; }
      .badge.blue{ background:#131f38; color:#7fa8f5; border-color:#22376a; }
      .badge.amber{ background:#2a2010; color:#e3ad5c; border-color:#4a3a1a; }
      .badge.red{ background:#2c1414; color:#f08a8a; border-color:#4a2020; }
    }
    button, .btn{ font:inherit; cursor:pointer; border:1px solid var(--border);
      background:var(--card); color:var(--text); padding:8px 14px; border-radius:9px;
      text-decoration:none; display:inline-block; }
    button.primary, .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger{ color:#b42323; border-color:#f5c9c9; }
    button:hover, .btn:hover{ filter:brightness(1.04); }
    input, select, textarea{ font:inherit; padding:8px 10px; border:1px solid var(--border);
      border-radius:9px; background:var(--bg); color:var(--text); width:100%; }
    form.inline{ display:flex; gap:8px; align-items:center; }
    a.link{ color:var(--accent); text-decoration:none; }
    a.link:hover{ text-decoration:underline; }
    .chip{ font-size:12px; background:var(--accent-weak); color:var(--text);
      padding:2px 8px; border-radius:8px; }
    .empty{ color:var(--muted); font-size:14px; padding:12px 0; }
    .list{ list-style:none; margin:0; padding:0; }
    .list li{ display:flex; align-items:center; gap:10px; padding:10px 0;
      border-bottom:1px solid var(--border); }
    .list li:last-child{ border-bottom:none; }
    .list .ttl{ font-weight:600; }
    .banner{ background:var(--accent-weak); border:1px solid var(--border); border-radius:10px;
      padding:10px 14px; font-size:13px; color:var(--muted); margin:12px 0; }
    .content-preview{ border:1px solid var(--border); border-radius:10px; padding:16px;
      background:var(--bg); line-height:1.7; }
    .content-preview h1,.content-preview h2,.content-preview h3{ margin:14px 0 6px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">🧵 가죽공예 카페 에이전트</span>
    <nav>
      <a href="/">🗂 대시보드</a>
      <a href="/settings">⚙️ 설정</a>
    </nav>
    <div class="spacer"></div>
    <form class="inline" method="post" action="/generate">
      <button class="primary" type="submit">✍️ 새 초안 생성</button>
    </form>
  </header>
  <main>
    {% if not has_key %}
    <div class="banner">⚠️ AI 키(<code>OPENAI_API_KEY</code> 또는 <code>ANTHROPIC_API_KEY</code>)가
      없어 초안 생성이 안 됩니다. 환경변수에 키를 넣어주세요.</div>
    {% endif %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
