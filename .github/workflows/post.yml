name: 인스타 릴스 자동 게시 (예전 · 수동)

# 사진(모델 컷) 자동화는 photo.yml 로 옮겨졌습니다.
# 이 워크플로는 예전 '릴스(영상)' 파이프라인이며, 자동 스케줄 대신
# 필요할 때만 수동으로 실행합니다.
on:
  workflow_dispatch: # 수동 실행 버튼

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg 설치 (placeholder 영상용)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 릴스 파이프라인 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER || 'placeholder' }}
          UPLOADER: ${{ vars.UPLOADER || 'none' }}
          VIDEO_API_KEY: ${{ secrets.VIDEO_API_KEY }}
        run: python -m src.main reel
