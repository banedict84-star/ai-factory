<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안산 의원 활동 모니터링 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --page:#EEF1F6; --card:#fff; --border:#E5E8EE; --divider:#F0F2F6; --divider2:#F2F4F8;
    --ink:#171A20; --t2:#4b525f; --t3:#5b6270; --t4:#79808d; --t5:#8A92A2; --t6:#9aa1ad;
    --accent:#0b57a4;
    --dem:#0b57a4; --dem-bg:#eaf1fb; --ppp:#d0272e; --ppp-bg:#fdecec;
    --star:#e0a422;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 18px 34px -26px rgba(16,24,40,.35);
    --shadow-rank:0 1px 2px rgba(16,24,40,.04),0 14px 30px -24px rgba(16,24,40,.4);
    --shadow-rank-h:0 1px 2px rgba(16,24,40,.05),0 22px 38px -22px rgba(16,24,40,.45);
    --shadow-detail:0 1px 2px rgba(16,24,40,.04),0 22px 40px -24px rgba(16,24,40,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--ink);
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:8px;}
  a{color:#2f4a7a;text-decoration:none;} a:hover{color:#1c2c4c;}
  ::selection{background:#d8e2f2;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* header */
  header.hero{background:linear-gradient(158deg,#1b2540 0%,#233258 62%,#2a3b64 100%);color:#fff;
    padding:clamp(26px,4.5vw,42px) 0 clamp(66px,8vw,88px);}
  .hero-in{max-width:1180px;margin:0 auto;padding:0 clamp(16px,3vw,24px);
    display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-end;justify-content:space-between;}
  .kicker{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .kicker i{width:6px;height:6px;border-radius:2px;background:#7f9bd6;}
  .kicker span{font-size:12.5px;font-weight:600;letter-spacing:.14em;color:#9fb0d6;text-transform:uppercase;}
  h1{margin:0;font-size:clamp(24px,3.4vw,35px);font-weight:800;letter-spacing:-.02em;line-height:1.12;}
  .hero p{margin:12px 0 0;max-width:640px;font-size:clamp(13px,1.4vw,14.5px);line-height:1.6;color:#b9c5de;}
  .hero p b{color:#e8eefb;font-weight:600;}
  .pill-upd{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 14px 8px 12px;}
  .live{position:relative;display:inline-flex;width:8px;height:8px;}
  .live i{position:absolute;inset:0;border-radius:999px;background:#43d17f;box-shadow:0 0 0 4px rgba(67,209,127,.22);}
  .pill-src{display:inline-flex;align-items:center;gap:7px;background:rgba(67,209,127,.14);
    border:1px solid rgba(67,209,127,.4);border-radius:999px;padding:5px 12px;}

  /* main / cards */
  main{max-width:1180px;margin:-54px auto 0;padding:0 clamp(16px,3vw,24px) 56px;position:relative;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px;}
  .stat{padding:20px 22px;}
  .stat .l{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--t5);}
  .bignum{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .chipwrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .issue{font-size:12px;font-weight:600;color:#39424f;background:#F2F4F8;border:1px solid #E7EAF0;border-radius:8px;padding:5px 10px;}

  .sec{margin-top:30px;}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .sec-h h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .sec-h .s{font-size:12.5px;color:var(--t5);}

  /* ranking */
  .rankgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px;}
  .rank-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 16px 15px 20px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-rank);
    transition:transform .15s ease,box-shadow .15s ease;}
  .rank-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-rank-h);}
  .rank-card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .rank-card .wm{position:absolute;top:12px;right:14px;font-size:34px;font-weight:800;color:#EEF1F6;letter-spacing:-.04em;line-height:1;}
  .rank-card .nm{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .rank-card .rd{font-size:12px;color:var(--t5);margin-top:3px;}
  .rank-card .rn{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;}

  .badge{font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:6px;padding:3px 7px;white-space:nowrap;}

  /* filter bar */
  .fbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .tabs{display:flex;flex:0 1 auto;flex-wrap:nowrap;overflow-x:auto;max-width:100%;
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;gap:3px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);-webkit-overflow-scrolling:touch;}
  .tab{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;border-radius:9px;
    padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;flex:none;
    background:transparent;color:var(--t3);transition:background .14s ease,color .14s ease;}
  .tab.on{background:var(--accent);color:#fff;}
  .tab .c{font-size:11.5px;font-weight:700;color:var(--t6);}
  .tab.on .c{color:rgba(255,255,255,.72);}
  .fmeta{font-size:12.5px;color:var(--t5);}
  .fmeta b{font-weight:700;color:var(--t2);}

  /* list + detail */
  .ld{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;}
  .list{flex:3 1 460px;min-width:0;overflow:hidden;}
  .list .head{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid #EEF1F6;
    font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--t6);}
  .row{border-bottom:1px solid var(--divider2);}
  .row-main{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:13px 18px;border-left:3px solid transparent;}
  .row.sel .row-main{border-left-color:var(--accent);}
  .row.sel{background:#f4f7fd;}
  .rk{width:22px;text-align:right;font-size:13px;font-weight:700;color:#b5bcc7;}
  .nbtn{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-family:inherit;padding:0;text-align:left;}
  .pdot{width:8px;height:8px;border-radius:3px;flex:none;}
  .nbtn .nm{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em;min-width:3.1em;}
  .dist-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #E1E5EC;background:#F7F9FC;cursor:pointer;
    font-family:inherit;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;
    transition:.13s;}
  .dist-btn:hover{border-color:#c7cfda;background:#eef2f8;}
  .dist-btn .n{font-size:10px;color:var(--t6);}
  .barwrap{flex:1 1 130px;min-width:110px;display:flex;align-items:center;gap:10px;}
  .bar{flex:1;height:8px;border-radius:999px;background:#EEF1F6;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:999px;}
  .rnum{font-size:14px;font-weight:800;color:#2b313b;width:30px;text-align:right;}
  .row-meta{padding:0 18px 11px 55px;margin-top:-3px;font-size:11.5px;color:var(--t5);}
  .row-meta b{color:var(--t3);font-weight:700;}
  .dongrow{padding:2px 18px 15px 55px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .dongrow .lab{font-size:11px;font-weight:700;color:var(--t6);margin-right:2px;}
  .dchip{font-size:11.5px;font-weight:600;color:#3a4350;background:#EDF2F9;border:1px solid #dde5f0;border-radius:7px;padding:4px 9px;}

  .detail{flex:1 1 320px;min-width:0;max-width:400px;position:sticky;top:16px;}
  .dcard{overflow:hidden;box-shadow:var(--shadow-detail);}
  .dsec{padding:16px 22px;border-bottom:1px solid var(--divider);}
  .dhead{padding:20px 22px 18px;border-bottom:1px solid var(--divider);}
  .dhead .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pbadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 9px;}
  .pbadge i{width:7px;height:7px;border-radius:2px;}
  .dname{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:12px;}
  .dbig{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .drow{display:flex;align-items:center;justify-content:space-between;}
  .mchip{font-size:11px;font-weight:600;color:#7a5a12;background:#FBF3E2;border:1px solid #f0e2c4;border-radius:7px;padding:4px 9px;}
  .art{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--divider2);text-decoration:none;color:inherit;}
  .art .dt{font-size:11.5px;font-weight:700;color:#aeb5c0;white-space:nowrap;padding-top:1px;}
  .art .att{font-size:13px;font-weight:600;line-height:1.45;color:#2b313b;}
  .art:hover .att{color:var(--accent);}
  .art .asrc{font-size:11px;color:var(--t6);margin-top:4px;}

  .foot{margin-top:28px;padding:20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .foot .badge-live{font-size:11px;font-weight:800;letter-spacing:.03em;color:#177e63;background:#e7f5f0;border:1px solid #c9e8dd;border-radius:6px;padding:4px 9px;}
  .foot .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 28px;font-size:12px;line-height:1.65;color:var(--t4);}
  .foot .cols p{margin:0;} .foot .cols b{color:var(--t2);}
  .empty{padding:40px 20px;color:var(--t5);font-size:13px;text-align:center;}
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-in">
      <div style="min-width:0;">
        <div class="kicker"><i></i><span>Ansan Legislative Monitor</span></div>
        <h1>안산 의원 활동 모니터링</h1>
        <p>국회의원 · 경기도의원 · 안산시의원 &nbsp;<b>지역구 칩</b>을 누르면 관할 동(洞)이 펼쳐지고, <b>이름</b>을 누르면 최근 90일 확인 보도가 열립니다.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;">
        <div class="pill-upd">
          <span class="live"><i></i></span>
          <span style="font-size:12.5px;color:#cdd8ee;">최신 갱신</span>
          <span class="tnum" id="ts" style="font-size:12.5px;font-weight:700;color:#fff;">—</span>
        </div>
        <div class="pill-src">
          <span style="font-size:11.5px;font-weight:700;letter-spacing:.03em;color:#8ef0bb;">AUTO</span>
          <span id="src" style="font-size:11.5px;color:#cbe9d8;">자동 수집</span>
        </div>
      </div>
    </div>
  </header>

  <main id="main"><div class="empty">불러오는 중…</div></main>

<script>
// ===== 지역구별 관할 동 (선관위 획정 기준) =====
const DONG = {
  nat_gap:[{gu:"상록구",d:["사동","사이동","해양동","본오3동","본오1동","본오2동","반월동"]}],
  nat_eul:[{gu:"상록구",d:["일동","이동","성포동","부곡동","월피동","안산동"]},{gu:"단원구",d:["고잔동","중앙동","호수동"]}],
  nat_byeong:[{gu:"단원구",d:["원곡동","백운동","신길동","선부1동","선부2동","선부3동","와동","초지동","대부동"]}],
  prov1:[{gu:"상록구",d:["사동","사이동","해양동","본오3동"]}],
  prov2:[{gu:"상록구",d:["본오1동","본오2동","반월동"]}],
  prov3:[{gu:"상록구",d:["일동","이동","성포동"]}],
  prov4:[{gu:"상록구",d:["부곡동","월피동","안산동"]}],
  prov5:[{gu:"단원구",d:["고잔동","중앙동","호수동"]}],
  prov6:[{gu:"단원구",d:["와동","선부3동"]}],
  prov7:[{gu:"단원구",d:["원곡동","백운동","신길동","선부1동","선부2동"]}],
  prov8:[{gu:"단원구",d:["초지동","대부동"]}],
  city_ga:[{gu:"상록구",d:["사동","사이동","해양동","본오3동"]}],
  city_na:[{gu:"상록구",d:["본오1동","본오2동","반월동"]}],
  city_da:[{gu:"상록구",d:["일동","이동","성포동"]}],
  city_ra:[{gu:"상록구",d:["부곡동","월피동","안산동"]}],
  city_ma:[{gu:"단원구",d:["고잔동","중앙동","호수동"]}],
  city_ba:[{gu:"단원구",d:["선부3동","와동"]}],
  city_sa:[{gu:"단원구",d:["선부1동","선부2동","백운동","원곡동","신길동"]}],
  city_a:[{gu:"단원구",d:["대부동","초지동"]}],
  city_pr:[]
};
const ISSUES_TOP = ['ASV 경제자유구역','교육예산','신안산선 연장','과밀학급','소방 인프라'];
const LV = {
  nat:{label:'국회의원', color:'#5b46b0', bg:'#efecfa'},
  prov:{label:'경기도의원', color:'#177e63', bg:'#e7f5f0'},
  city:{label:'안산시의원', color:'#b96f14', bg:'#fbf0e2'}
};
const PC={D:'#0b57a4',K:'#d0272e'}, PBG={D:'#eaf1fb',K:'#fdecec'}, PFULL={D:'더불어민주당',K:'국민의힘'};
const ACCENT='#0b57a4';
const CITY_SG=["가선거구","나선거구","다선거구","라선거구","마선거구","바선거구","사선거구","아선거구","비례대표"];
const NAT_ORDER=["안산갑","안산을","안산병"];
const TORDER={nat:0,prov:1,city:2};
function distIdx(m){ // 급별 지역구 정렬 인덱스
  if(m.t==='nat') return NAT_ORDER.indexOf(m.sd);
  if(m.t==='prov') return parseInt(m.sd,10)||99;      // "1선거구"→1
  if(m.t==='city') return CITY_SG.indexOf(m.sd);
  return 99;
}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function dongsOf(dk){ const g=DONG[dk]; if(!g||!g.length) return ['안산시 전역']; return g.flatMap(x=>x.d); }
function subMeta(m){ return [m.term,m.comm,m.title].filter(Boolean).join(' · '); }

let M=[], filter='all', selectedN=null, openN=null, MAXR=1;
const mainEl=document.getElementById('main');

function boot(data){
  M=(data&&data.members)||[];
  M.forEach(m=>{ m.c=(m.a||[]).length; });
  MAXR=Math.max(1,...M.map(m=>m.c));
  const top=[...M].sort((a,b)=>b.c-a.c)[0];
  selectedN=top?top.n:null;
  if(data&&data.generatedAt) document.getElementById('ts').textContent=data.generatedAt;
  document.getElementById('src').textContent='자동 수집 · '+((data&&data.source)||'뉴스 검색');
  render();
}

const FILTERS=[['all','전체'],['nat','국회의원'],['prov','경기도의원'],['city','안산시의원']];

function render(){
  if(!M.length){ mainEl.innerHTML='<div class="empty">데이터를 불러오지 못했습니다. data/members.json 을 확인하세요.</div>'; return; }
  const tot=M.length;
  const cN=M.filter(m=>m.t==='nat').length, cD=M.filter(m=>m.t==='prov').length, cS=M.filter(m=>m.t==='city').length;
  const dem=M.filter(m=>m.p==='D').length, ppp=M.filter(m=>m.p==='K').length;
  const ranked=[...M].sort((a,b)=>b.c-a.c).slice(0,5);
  const filtered=M.filter(m=>filter==='all'||m.t===filter).sort((a,b)=>
    (TORDER[a.t]-TORDER[b.t]) || (distIdx(a)-distIdx(b)) || (b.c-a.c));
  const sel=M.find(m=>m.n===selectedN);
  const cnt={all:tot,nat:cN,prov:cD,city:cS};

  mainEl.innerHTML=`
    <section class="strip">
      <div class="card stat">
        <div class="l">모니터링 의원</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:10px;">
          <span class="bignum tnum">${tot}</span><span style="font-size:16px;font-weight:700;color:var(--t2);">명</span>
        </div>
        <div class="tnum" style="margin-top:12px;font-size:12.5px;color:var(--t4);">국회 ${cN} · 도의 ${cD} · 시의 ${cS}</div>
      </div>
      <div class="card stat">
        <div class="l">정당 구성</div>
        <div style="display:flex;height:12px;border-radius:999px;overflow:hidden;background:#EEF1F6;margin-top:16px;">
          <div style="width:${dem/tot*100}%;background:var(--dem);"></div><div style="width:${ppp/tot*100}%;background:var(--ppp);"></div>
        </div>
        <div style="display:flex;gap:18px;margin-top:13px;">
          <div style="display:flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:3px;background:var(--dem);"></span><span style="font-size:12.5px;color:var(--t2);">더불어민주당</span><span class="tnum" style="font-size:13px;font-weight:800;">${dem}</span></div>
          <div style="display:flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:3px;background:var(--ppp);"></span><span style="font-size:12.5px;color:var(--t2);">국민의힘</span><span class="tnum" style="font-size:13px;font-weight:800;">${ppp}</span></div>
        </div>
      </div>
      <div class="card stat">
        <div class="l">최근 핵심 현안</div>
        <div class="chipwrap">${ISSUES_TOP.map(i=>`<span class="issue">${esc(i)}</span>`).join('')}</div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>주목 인물</h2><span class="s">최근 90일 최다 보도 · 상위 5인</span></div>
      <div class="rankgrid">
        ${ranked.map((m,i)=>`
          <div class="rank-card" data-select="${esc(m.n)}">
            <span class="stripe" style="background:${PC[m.p]}"></span>
            <span class="wm tnum">${i+1}</span>
            <div><span class="badge" style="color:${LV[m.t].color};background:${LV[m.t].bg};">${LV[m.t].label}</span></div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:12px;">
              ${i===0?'<span style="color:var(--star);font-size:16px;line-height:1;">★</span>':''}
              <span class="nm">${esc(m.n)}</span>
            </div>
            <div class="rd">${esc(m.sd)}</div>
            <div style="display:flex;align-items:baseline;gap:5px;margin-top:14px;">
              <span class="rn tnum" style="color:${PC[m.p]}">${m.c}</span><span style="font-size:13px;font-weight:700;color:var(--t2);">건</span>
            </div>
            <div style="font-size:11px;color:var(--t6);margin-top:5px;">확인 보도 · 90일</div>
          </div>`).join('')}
      </div>
    </section>

    <section class="sec">
      <div class="fbar">
        <div class="tabs">
          ${FILTERS.map(([k,l])=>`<button class="tab ${k===filter?'on':''}" data-filter="${k}"><span>${l}</span><span class="c tnum">${cnt[k]}</span></button>`).join('')}
        </div>
        <div class="fmeta">${FILTERS.find(f=>f[0]===filter)[1]} · <b class="tnum">${filtered.length}</b>명 · 지역구순</div>
      </div>
      <div class="ld">
        <div class="card list">
          <div class="head"><span style="width:22px;text-align:right;">#</span><span style="flex:1;">의원</span><span>최근 90일 확인 보도</span></div>
          ${filtered.map((m,i)=>rowHTML(m,i+1)).join('')}
        </div>
        <div class="detail">${sel?detailHTML(sel,filtered.findIndex(x=>x.n===sel.n)+1):'<div class="card dcard"><div class="empty">의원을 선택하세요.</div></div>'}</div>
      </div>
    </section>

    <section class="card foot">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <span class="badge-live">AUTO</span>
        <span style="font-size:12.5px;color:var(--t4);">뉴스 검색으로 하루 3회 자동 수집됩니다 (08·14·20시 KST). 동명이인 등 일부 오탐이 포함될 수 있습니다.</span>
      </div>
      <div class="cols">
        <p><b>지표</b> = 최근 90일 <b>확인 보도 건수</b> — '이름 의원' 뉴스 검색 결과 중 최신순 표본입니다.</p>
        <p><b>지역구 관할 동</b>은 중앙선관위 선거구 획정 기준 — 도의원(1~8선거구)·시의원(가~아선거구)·국회의원(갑·을·병) 급별 경계가 다릅니다.</p>
        <p><b>데이터 출처</b> · 네이버/구글 뉴스 검색 · 선거구/관할 동: 중앙선거관리위원회 획정 기준 · 로스터: 6·3 지방선거 당선인 및 원구성 보도(2026.7).</p>
      </div>
    </section>`;

  mainEl.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{selectedN=el.dataset.select;render();});
  mainEl.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render();});
  mainEl.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();openN=(openN===el.dataset.toggle)?null:el.dataset.toggle;render();});
}

function rowHTML(m,rank){
  const dongs=dongsOf(m.dk), open=openN===m.n, meta=subMeta(m);
  return `<div class="row ${m.n===selectedN?'sel':''}">
    <div class="row-main">
      <span class="rk tnum">${rank}</span>
      <button class="nbtn" data-select="${esc(m.n)}"><span class="pdot" style="background:${PC[m.p]}"></span><span class="nm">${esc(m.n)}</span></button>
      <span class="badge" style="color:${LV[m.t].color};background:${LV[m.t].bg};">${LV[m.t].label}</span>
      <button class="dist-btn" data-toggle="${esc(m.n)}"><span>${esc(m.sd)}</span><span class="n">관할동 ${dongs.length}</span></button>
      <div class="barwrap">
        <div class="bar"><i style="width:${Math.round(m.c/MAXR*100)}%;background:${PC[m.p]}"></i></div>
        <span class="rnum tnum">${m.c}</span>
      </div>
    </div>
    ${meta?`<div class="row-meta">${esc(meta)}</div>`:''}
    ${open?`<div class="dongrow"><span class="lab">관할 동</span>${dongs.map(d=>`<span class="dchip">${esc(d)}</span>`).join('')}</div>`:''}
  </div>`;
}

function detailHTML(m,rank){
  const dongs=dongsOf(m.dk);
  const meta=[m.term,m.comm,m.title].filter(Boolean);
  const arts=(m.a||[]).map(a=>{
    const dt=(a.d||'').replace('-','.');
    return `<a class="art" href="${esc(a.u||'#')}" target="_blank" rel="noopener">
      <span class="dt tnum">${esc(dt)}</span>
      <div style="min-width:0;"><div class="att">${esc(a.t)}</div><div class="asrc">${esc(a.s||'')}</div></div></a>`;
  }).join('');
  return `<div class="card dcard">
    <div class="dhead">
      <div class="row1">
        <span class="badge" style="color:${LV[m.t].color};background:${LV[m.t].bg};">${LV[m.t].label}</span>
        <span class="pbadge" style="color:${PC[m.p]};background:${PBG[m.p]};"><i style="background:${PC[m.p]}"></i>${PFULL[m.p]}</span>
      </div>
      <div class="dname">${esc(m.n)}</div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-top:14px;">
        <div>
          <div style="display:flex;align-items:baseline;gap:5px;"><span class="dbig tnum" style="color:${PC[m.p]}">${m.c}</span><span style="font-size:15px;font-weight:700;color:var(--t2);">건</span></div>
          <div style="font-size:11.5px;color:var(--t6);margin-top:5px;">최근 90일 확인 보도</div>
        </div>
      </div>
    </div>
    <div class="dsec">
      <div class="drow"><span style="font-size:11.5px;font-weight:700;color:var(--t6);">지역구 · 관할 동</span><span style="font-size:12.5px;font-weight:700;color:#3a4350;">${esc(m.dist||m.sd)}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;">${dongs.map(d=>`<span class="dchip">${esc(d)}</span>`).join('')}</div>
      ${meta.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">${meta.map(x=>`<span class="mchip">${esc(x)}</span>`).join('')}</div>`:''}
    </div>
    <div style="padding:16px 22px 20px;">
      <div class="drow" style="margin-bottom:12px;"><span style="font-size:12.5px;font-weight:800;color:#2b313b;">최근 확인 보도${m.n==='장윤정'?' · <span style="color:var(--star);font-weight:600;">고양시의원 동명이인 제외</span>':''}</span><span class="tnum" style="font-size:11.5px;color:var(--t6);">${(m.a||[]).length}건 표시</span></div>
      <div style="display:flex;flex-direction:column;gap:2px;">${arts||'<div class="empty">수록된 기사가 없습니다.</div>'}</div>
    </div>
  </div>`;
}

fetch('data/members.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(boot)
  .catch(err=>{ mainEl.innerHTML='<div class="empty">데이터를 불러오지 못했습니다 ('+err+').<br>data/members.json 을 확인하세요.</div>'; });
</script>
</body>
</html>
