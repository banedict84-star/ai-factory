# Render 배포 설정 (Blueprint)
# render.com → New + → Blueprint → 이 저장소 선택 → OPENAI_API_KEY / APP_PASSWORD 입력 → 배포
services:
  - type: web
    name: ai-employee-os
    runtime: python
    branch: claude/korean-greeting-wkvr53
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m oms.main serve
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EXECUTOR
        value: openai
      - key: EXECUTOR_IMAGE_MODEL
        value: dall-e-3       # 호스팅에선 검증 없이 바로 되는 dall-e-3 사용
      - key: OPENAI_API_KEY
        sync: false           # ← Render 대시보드에서 직접 입력(비밀)
      - key: APP_PASSWORD
        sync: false           # ← (권장) 사이트 접속 비밀번호. 비워두면 잠금 없음

  # 🎬 Grok Studio — 쇼핑몰 모델 영상 생성기 (그록 API)
  - type: web
    name: grok-studio
    runtime: python
    branch: claude/grok-shopping-model-video-2wrfn7
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn grok_studio.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: XAI_API_KEY
        sync: false           # ← Render 대시보드에서 그록 키 입력(비밀)
      - key: ADMIN_EMAIL
        sync: false           # ← 이 이메일로 가입하면 관리자(크레딧 지급 권한)
      - key: BANK_INFO
        sync: false           # ← (선택) 충전 안내 계좌 문구
      - key: APP_PASSWORD
        sync: false           # ← (선택) 사이트 접속 비밀번호. 비우면 잠금 없음
      # ⚠️ 회원/크레딧 영구 저장:
      # 무료(free) 플랜은 재배포 시 DB가 초기화됩니다(회원·크레딧 사라짐) — 테스트용.
      # 실제 서비스로 유지하려면 ↓ 3가지를 함께 적용:
      #   1) plan: free → starter (유료)
      #   2) 아래 disk 주석 해제
      #   3) GROK_STUDIO_DB 를 /var/data/grok_studio.db 로 지정(주석 해제)
      # - key: GROK_STUDIO_DB
      #   value: /var/data/grok_studio.db
    # disk:
    #   name: grok-studio-data
    #   mountPath: /var/data
    #   sizeGB: 1
