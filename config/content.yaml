# ─────────────────────────────────────────────────────────────
# 콘텐츠 설정 — 여기만 바꾸면 에이전트가 만드는 영상의 방향이 달라집니다.
# ─────────────────────────────────────────────────────────────

# 채널의 정체성 / 컨셉
brand:
  name: "매일 한 컷"
  # 채널이 어떤 채널인지, 무엇을 보여주는지
  description: >
    일상의 사소하고 소소한 순간을 짧고 감각적인 영상으로 보여주는 채널.
    예: 부추를 다듬는 손, 신발을 신는 순간처럼 별것 아닌데 자꾸 보게 되는 장면.
  # 말투 / 분위기
  tone: "담백하고 따뜻하며, 살짝 위트 있게"
  language: "ko"

# 영상 규격
video:
  aspect_ratio: "9:16"     # 릴스 세로 영상
  duration_seconds: 8
  # 영상에서 반복적으로 지키고 싶은 스타일
  style: "자연광, 클로즈업, 잔잔한 움직임, 자막 최소화"

# 캡션 규칙
caption:
  max_length: 150
  emoji: true
  call_to_action: "저장하고 오늘 하루 천천히 보내기 🌿"

# 해시태그
hashtags:
  count: 8
  always_include:
    - "#일상"
    - "#숏폼"
  themes:
    - "소확행"
    - "브이로그"
    - "감성"

# 아이디어 소재 풀 (에이전트가 이 중에서 고르거나 변주합니다)
topics:
  - "부추를 손질하는 손 클로즈업"
  - "신발을 신는 순간"
  - "커피를 내리는 아침"
  - "빗소리와 창문"
  - "빨래를 개는 장면"
  - "고양이가 햇볕에 눕는 순간"
