# ─────────────────────────────────────────────────────────────
# 네이버 카페 설정 — 여기만 바꾸면 에이전트가 쓰는 글의 방향이 달라집니다.
# ─────────────────────────────────────────────────────────────

# 카페의 정체성 / 컨셉
brand:
  name: "우리 동네 카페"
  # 어떤 카페인지, 회원들이 무엇을 기대하는지
  description: >
    동네 이웃들이 모여 맛집·생활정보·소소한 일상을 나누는 커뮤니티.
    지나치게 광고 같지 않고, 이웃에게 말 걸듯 친근한 글을 지향합니다.
  # 말투 / 분위기
  tone: "친근하고 다정하며, 정보는 정확하게"
  language: "ko"

# 글 규격
post:
  # 본문 길이 목표(글자 수 대략). 너무 길지도 짧지도 않게.
  target_length: 700
  # 본문에 HTML 을 쓸지 여부 (네이버 카페 API 는 HTML 본문을 허용)
  use_html: true
  # 소제목/문단 구조를 갖출지
  structured: true
  # 마무리 문구 (call to action). 댓글·이웃 유도 등
  call_to_action: "궁금한 점은 댓글로 편하게 남겨주세요 🙂"
  # 전체공개 여부 (네이버 카페 openyn). 회원 공개만 하려면 false
  open_to_public: true

# 발행 대상 (실제 값은 .env 의 NAVER_CAFE_CLUB_ID / NAVER_CAFE_MENU_ID 로도 지정 가능)
target:
  # 카페 URL 이름 (예: cafe.naver.com/이_부분). clubid 자동 조회에 사용.
  cafe_url_name: ""
  # 숫자 카페 ID (clubid). 알고 있으면 직접 넣으세요. 비우면 cafe_url_name 으로 조회.
  club_id: ""
  # 게시판(메뉴) ID (menuid). 카페 관리 > 게시판 설정에서 확인.
  menu_id: ""

# 글 소재 풀 (에이전트가 이 중에서 고르거나 변주합니다)
topics:
  - "이번 주 동네 맛집 한 곳 소개"
  - "생활에 도움되는 꿀팁 하나"
  - "요즘 동네 소식 / 행사 안내"
  - "계절에 맞는 생활 정보"
  - "회원들에게 묻는 가벼운 질문 (참여 유도)"

# 피해야 할 것 (에이전트가 지킬 금지 사항)
avoid:
  - "과장된 광고 문구나 낚시성 제목"
  - "확인되지 않은 정보 단정"
  - "개인정보·연락처 노출"
