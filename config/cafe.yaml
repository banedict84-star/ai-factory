# ─────────────────────────────────────────────────────────────
# 네이버 카페 설정 — 여기만 바꾸면 에이전트가 쓰는 글의 방향이 달라집니다.
# ─────────────────────────────────────────────────────────────

# 카페의 정체성 / 컨셉
brand:
  name: "우리 동네 카페"
  # 어떤 카페인지, 회원들이 무엇을 기대하는지
  description: >
    동네 이웃들이 모여 맛집·생활정보·소소한 일상을 나누는 커뮤니티.
    지나치게 광고 같지 않고, 이웃에게 말 걸듯 친근한 글을 지향합니다.
  # 말투 / 분위기
  tone: "친근하고 다정하며, 정보는 정확하게"
  language: "ko"

# 글 규격
post:
  # 본문 길이 목표(글자 수 대략). 너무 길지도 짧지도 않게.
  target_length: 700
  # 본문에 HTML 을 쓸지 여부 (네이버 카페 API 는 HTML 본문을 허용)
  use_html: true
  # 소제목/문단 구조를 갖출지
  structured: true
  # 마무리 문구 (call to action). 댓글·이웃 유도 등
  call_to_action: "궁금한 점은 댓글로 편하게 남겨주세요 🙂"
  # 전체공개 여부 (네이버 카페 openyn). 회원 공개만 하려면 false
  open_to_public: true

# 발행 대상 (실제 값은 .env 의 NAVER_CAFE_CLUB_ID / NAVER_CAFE_MENU_ID 로도 지정 가능)
target:
  # 카페 URL 이름 (예: cafe.naver.com/이_부분). clubid 자동 조회에 사용.
  cafe_url_name: ""
  # 숫자 카페 ID (clubid). 알고 있으면 직접 넣으세요. 비우면 cafe_url_name 으로 조회.
  club_id: ""
  # 게시판(메뉴) ID (menuid). 카페 관리 > 게시판 설정에서 확인.
  menu_id: ""

# 글 소재 풀 (에이전트가 이 중에서 고르거나 변주합니다)
# 매일 1회 자동 발행이므로, 반복되지 않게 소재를 넉넉하고 다양하게 둡니다.
topics:
  # 맛집·먹거리
  - "이번 주 가볼 만한 동네 맛집 한 곳 소개"
  - "가성비 좋은 동네 밥집 / 혼밥하기 좋은 곳"
  - "요즘 뜨는 동네 카페 / 디저트 가게"
  - "집에서 간단히 해먹는 오늘의 한 끼 레시피"
  # 생활정보·꿀팁
  - "생활에 바로 쓰는 꿀팁 하나 (청소·정리·절약 등)"
  - "돈 아끼는 생활 절약 팁"
  - "계절에 맞는 건강·생활 관리 정보"
  - "동네에서 유용한 시설·서비스 소개 (병원·마트·공방 등)"
  # 동네 소식·정보
  - "이번 주 동네 소식 / 행사·축제 안내"
  - "동네 산책·나들이 코스 추천"
  - "아이와 함께 가기 좋은 동네 장소"
  - "반려동물과 가기 좋은 동네 스팟"
  # 계절·시즌
  - "이번 계절/이번 달에 어울리는 활동 제안"
  - "요즘 날씨에 챙기면 좋은 것들"
  # 참여 유도 (회원 소통)
  - "회원들에게 묻는 가벼운 질문 (오늘 뭐 드셨나요 등)"
  - "이번 주 추천받고 싶은 것 (맛집·영화·나들이 등) 묻기"
  - "동네 관련 정보 공유 요청 (아는 곳 있으면 댓글로)"

# 피해야 할 것 (에이전트가 지킬 금지 사항)
avoid:
  - "과장된 광고 문구나 낚시성 제목"
  - "확인되지 않은 정보 단정"
  - "개인정보·연락처 노출"
