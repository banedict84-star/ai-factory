# ─────────────────────────────────────────────────────────────
# 네이버 카페 설정 — 가죽공예 카페.
# 여기만 바꾸면 에이전트가 쓰는 글의 방향이 달라집니다.
# ─────────────────────────────────────────────────────────────

# 카페의 정체성 / 컨셉
brand:
  name: "가죽공예 공방 카페"
  # 어떤 카페인지, 회원들이 무엇을 기대하는지
  description: >
    가죽공예를 좋아하는 사람들이 모여 재료·도구·기법을 나누고,
    초보자는 배우고 경험자는 노하우를 공유하는 커뮤니티.
    핸드메이드 가죽 소품(지갑·가방·키링 등)을 직접 만드는 취미를 응원합니다.
  # 말투 / 분위기
  tone: "친근하고 다정하며, 초보도 이해되게 쉽지만 정확하게"
  language: "ko"

# 글 규격
post:
  # 본문 길이 목표(글자 수 대략). 정보성 알맹이를 담으려면 넉넉하게.
  target_length: 1300
  # 본문에 HTML 을 쓸지 여부 (네이버 카페 API 는 HTML 본문을 허용)
  use_html: true
  # 소제목/문단 구조를 갖출지 (정보성 글이라 권장)
  structured: true
  # 마무리 문구 (call to action). 댓글·작품자랑·질문 유도 등
  call_to_action: "궁금한 점이나 여러분의 작품은 댓글로 편하게 나눠주세요 🙂"
  # 전체공개 여부 (네이버 카페 openyn). 회원 공개만 하려면 false
  open_to_public: true

# 발행 대상 (실제 값은 .env 의 NAVER_CAFE_CLUB_ID / NAVER_CAFE_MENU_ID 로도 지정 가능)
target:
  cafe_url_name: ""   # cafe.naver.com/<이 부분>. clubid 자동 조회에 사용.
  club_id: ""         # 숫자 카페 ID. 알면 직접 입력, 비우면 cafe_url_name 으로 조회.
  menu_id: ""         # 게시판(메뉴) ID. 카페 관리 > 게시판 설정에서 확인.

# 글 소재 풀 — 가죽공예 카테고리별. 매일 1회 발행이라 반복되지 않게 넉넉히.
topics:
  # ── 재료·자료 (가죽·부자재 지식) ──
  - "가죽 종류 알아보기 (베지터블 vs 크롬 태닝 차이)"
  - "가죽 두께(온스) 고르는 법과 용도별 추천"
  - "소가죽 부위별 특징 (벤드·숄더·벨리)"
  - "가죽 부자재 기초 (실·바늘·본드·엣지코트)"
  - "천연 가죽 vs 인조/비건 레더, 뭐가 다를까"
  # ── 초보 가이드 (입문자가 알아야 할 것) ──
  - "가죽공예 입문 준비물 체크리스트"
  - "초보가 처음 만들기 좋은 작품 추천 (카드지갑·키링)"
  - "초보가 자주 하는 실수와 피하는 법"
  - "새들 스티치(손바느질) 기초 배우기"
  - "가죽 재단·타공 기본기 익히기"
  - "엣지(코바) 마감 깔끔하게 하는 법"
  - "가죽 염색 입문 (기초 원리와 주의점)"
  # ── 도구 ──
  - "가죽공예 필수 공구 소개 (입문자용)"
  - "있으면 편한 중급 공구 / 지그 소개"
  - "공구 관리·보관 팁 (녹·손상 방지)"
  # ── 패턴·작품 ──
  - "이번 달 만들어볼 작품 패턴 소개"
  - "가죽 소품 아이디어 모음 (선물용·실용)"
  # ── 관리·유지보수 ──
  - "가죽 제품 관리법 (오일·보습·보관)"
  - "가죽에 물·얼룩 묻었을 때 대처법"
  # ── 이슈·트렌드 ──
  - "요즘 가죽공예 트렌드 / 인기 아이템"
  - "가죽 가격·수급 이슈 짚어보기"
  - "친환경·비건 레더 등 업계 이슈"
  # ── 공방·클래스 소개 ──
  - "가볼 만한 가죽공예 공방 / 원데이클래스 소개"
  - "온라인으로 배우기 좋은 자료·채널 소개"
  # ── 참여 유도 (회원 소통) ──
  - "회원 작품 자랑 이벤트 안내 (댓글로 사진 공유)"
  - "가죽공예 관련 가벼운 질문 (요즘 뭐 만드세요?)"
  - "초보 질문 받기 (막히는 부분 댓글로)"

# 피해야 할 것 (에이전트가 지킬 금지 사항)
avoid:
  - "과장된 광고 문구나 낚시성 제목"
  - "확인되지 않은 정보/수치 단정 (특히 가격·브랜드 정보)"
  - "특정 판매처 노골적 홍보나 개인 연락처 노출"
  - "저작권 있는 브랜드 패턴·디자인 무단 게시 조장"
